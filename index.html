<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Joselito Delivery OS</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-ios">

    <header class="ios-header">
        <div class="header-content">
            <div class="logo">
                <h1>JOSELITO</h1>
                <p>DELIVERY OS</p>
            </div>
            <div class="caja-display" onclick="editarCaja()">
                <span class="label-caja">CAJA FUERTE ✏️</span>
                <strong id="caja_global">$0.00</strong>
            </div>
        </div>
    </header>

    <main class="app-container">
        <section id="vista_operaciones" class="view active">
            <div class="ios-card">
                <h2 class="ios-title">📝 Registro de Servicio</h2>
                <input type="text" id="inp_cliente" class="ios-input" placeholder="Nombre del Cliente">
                <textarea id="inp_desc" class="ios-input ios-textarea" placeholder="Descripción del pedido..."></textarea>
                <select id="inp_tipo" class="ios-input ios-select">
                    <option value="Delivery">🍔 Delivery</option>
                    <option value="MotoTaxi">🏍️ MotoTaxi</option>
                    <option value="Mandado">📦 Mandado / Espera</option>
                </select>
            </div>

            <div class="ios-card border-gold">
                <h2 class="ios-title gold">💰 Cotizador Inteligente</h2>
                <div class="ios-tabs">
                    <button class="tab-btn active" id="btn_modo_km" onclick="setModo('km')">Distancia</button>
                    <button class="tab-btn" id="btn_modo_plana" onclick="setModo('plana')">Fijo</button>
                </div>

                <div id="modo_km" class="grid-2">
                    <div class="input-group">
                        <label>Kilómetros</label>
                        <input type="number" id="inp_km" class="ios-input center" placeholder="0.0" oninput="calcularPreview()">
                    </div>
                    <div class="input-group">
                        <label>Precio x KM</label>
                        <input type="number" id="inp_precio_km" class="ios-input center gold-text" placeholder="$0.0" oninput="calcularPreview()">
                    </div>
                </div>

                <div id="modo_plana" class="hidden">
                    <label>Monto Único</label>
                    <input type="number" id="inp_monto_fijo" class="ios-input center gold-text" placeholder="$0.00" oninput="calcularPreview()">
                </div>

                <div class="grid-2 mt-15">
                    <div class="input-group mini">
                        <label>% Moto</label>
                        <input type="number" id="inp_pct_moto" class="ios-input small" value="20" oninput="calcularPreview()">
                    </div>
                    <div class="input-group mini">
                        <label>% Gasolina</label>
                        <input type="number" id="inp_pct_gas" class="ios-input small" value="10" oninput="calcularPreview()">
                    </div>
                </div>
            </div>

            <div class="ios-preview">
                <div class="row"><span>A Cobrar:</span> <strong class="gold-text">$<span id="prev_total">0.00</span></strong></div>
                <div class="row small"><span>Fondo Moto:</span> <span class="blue-text">-$<span id="prev_moto">0.00</span></span></div>
                <div class="row small"><span>Fondo Gas:</span> <span class="red-text">-$<span id="prev_gas">0.00</span></span></div>
                <div class="row total"><span>NETO:</span> <strong class="green-text">$<span id="prev_neto">0.00</span></strong></div>
                
                <div class="actions mt-15">
                    <button onclick="enviarWaRapido()" class="ios-btn wa">WhatsApp</button>
                    <button id="btn_guardar" onclick="registrarViaje()" class="ios-btn save disabled">Guardar Viaje</button>
                </div>
            </div>
            <div id="msg_exito" class="toast hidden">¡Registrado!</div>
        </section>

        <section id="vista_logs" class="view hidden">
            <div class="sticky-sub">
                <button onclick="exportarExcel()" class="ios-btn export">📥 Exportar Reporte Excel</button>
            </div>
            <div id="lista_logs" class="ios-list"></div>
            <button onclick="borrarHistorial()" class="danger-link">Borrar historial permanentemente</button>
        </section>

        <section id="vista_graficos" class="view hidden">
            <div class="ios-card">
                <h2 class="ios-title text-center">Rendimiento</h2>
                <div class="chart-box"><canvas id="miGrafico"></canvas></div>
                <div class="grid-2 mt-15">
                    <div class="ios-stat blue">
                        <span class="label">MOTO</span>
                        <strong id="stat_moto">$0</strong>
                    </div>
                    <div class="ios-stat green">
                        <span class="label">NETO</span>
                        <strong id="stat_neta">$0</strong>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <nav class="ios-navbar">
        <button id="nav_operar" onclick="cambiarVista('vista_operaciones', 'nav_operar')" class="nav-link active">
            <span class="icon">⚡</span><span class="txt">Operar</span>
        </button>
        <button id="nav_logs" onclick="cambiarVista('vista_logs', 'nav_logs')" class="nav-link">
            <span class="icon">📋</span><span class="txt">Historial</span>
        </button>
        <button id="nav_graficos" onclick="cambiarVista('vista_graficos', 'nav_graficos')" class="nav-link">
            <span class="icon">📊</span><span class="txt">Gráficos</span>
        </button>
    </nav>

    <script src="script.js"></script>
</body>
</html>
