<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joselito Delivery OS</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <header class="header">
        <div class="logo">
            <h1>JOSELITO DELIVERY</h1>
            <p>Sistema de Gestión Integral</p>
        </div>
        <div class="caja-total">
            <span class="text-muted">Caja Fuerte</span>
            <strong id="caja_global">$0.00</strong>
        </div>
    </header>

    <main class="container">
        <section id="vista_operaciones" class="view active">
            <div class="card">
                <h2>1. Registro del Viaje</h2>
                <input type="text" id="inp_cliente" class="input" placeholder="Cliente o Referencia">
                <textarea id="inp_desc" class="input textarea" placeholder="Descripción del envío..."></textarea>
                <select id="inp_tipo" class="input">
                    <option value="Delivery">🍔 Delivery</option>
                    <option value="MotoTaxi">🏍️ MotoTaxi</option>
                    <option value="Mandado">📦 Mandado</option>
                </select>
            </div>

            <div class="card highlight">
                <h2 class="text-gold">2. Tu Tarifa Dinámica</h2>
                <div class="tabs-tarifa">
                    <button class="btn-tab active" onclick="setModo('km')">Por KM</button>
                    <button class="btn-tab" onclick="setModo('plana')">Tarifa Plana</button>
                </div>

                <div id="modo_km" class="grid-2 mt-1">
                    <div>
                        <label>Distancia (KM)</label>
                        <input type="number" id="inp_km" class="input" placeholder="Ej: 5.5">
                    </div>
                    <div>
                        <label>Precio x KM ($)</label>
                        <input type="number" id="inp_precio_km" class="input text-gold bold" placeholder="Ej: 0.80">
                    </div>
                </div>

                <div id="modo_plana" class="mt-1 hidden">
                    <label>Monto Fijo ($)</label>
                    <input type="number" id="inp_monto_fijo" class="input text-gold bold" placeholder="Ej: 5.00">
                </div>

                <button onclick="calcularYGuardar()" class="btn btn-gold mt-2">CALCULAR Y GUARDAR</button>
            </div>
            
            <div id="msg_exito" class="msg-success hidden">¡Viaje registrado en tu base de datos!</div>
        </section>

        <section id="vista_logs" class="view hidden">
            <div class="card flex-between">
                <h2>Historial de Operaciones</h2>
                <button onclick="exportarExcel()" class="btn btn-blue text-small">💾 EXPORTAR EXCEL</button>
            </div>
            
            <div id="lista_logs" class="logs-container">
                </div>
            
            <button onclick="borrarHistorial()" class="btn btn-danger mt-2">🚨 BORRAR TODOS LOS DATOS</button>
        </section>

        <section id="vista_graficos" class="view hidden">
            <div class="card">
                <h2>Rendimiento Financiero</h2>
                <p class="text-muted text-small mb-1">Ganancias generadas en los últimos viajes</p>
                <div class="chart-container">
                    <canvas id="miGrafico"></canvas>
                </div>
                
                <div class="grid-2 mt-2">
                    <div class="stat-box border-blue">
                        <span class="text-muted text-small">Fondo Moto Total</span>
                        <strong class="text-blue text-large" id="stat_moto">$0.00</strong>
                    </div>
                    <div class="stat-box border-green">
                        <span class="text-muted text-small">Tu Ganancia Neta</span>
                        <strong class="text-green text-large" id="stat_neta">$0.00</strong>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <nav class="bottom-nav">
        <button onclick="cambiarVista('vista_operaciones', this)" class="nav-item active">⚡<br>Operar</button>
        <button onclick="cambiarVista('vista_logs', this)" class="nav-item">📋<br>Historial</button>
        <button onclick="cambiarVista('vista_graficos', this)" class="nav-item">📊<br>Gráficos</button>
    </nav>

    <script src="script.js"></script>
</body>
</html>
