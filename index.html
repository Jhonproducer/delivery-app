<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guanipa-Tigre Express PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans p-4">

    <div class="max-w-md mx-auto bg-gray-800 rounded-xl shadow-2xl p-6 border border-yellow-500 mt-5">
        <h1 class="text-2xl font-bold text-yellow-500 mb-4 text-center">🏍️ Guanipa-Tigre Express</h1>
        <p class="text-center text-gray-400 text-sm mb-6">Cotizador Inteligente V2.0</p>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-semibold mb-1">Tipo de Servicio</label>
                <select id="tipoServicio" class="w-full p-2 rounded bg-gray-700 border-none focus:ring-2 focus:ring-yellow-500 text-white">
                    <option value="delivery">🍔 Delivery (Comida/Paquetes ligeros)</option>
                    <option value="mototaxi">🧑‍🤝‍🧑 MotoTaxi (Pasajeros)</option>
                    <option value="mandado">📦 Mandado/Encomienda especial</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold mb-1">¿Qué llevas o a quién?</label>
                <input type="text" id="descripcion" placeholder="Ej: 2 Hamburguesas de McDonald's" class="w-full p-2 rounded bg-gray-700 border-none focus:ring-2 focus:ring-yellow-500 text-white">
            </div>

            <div>
                <label class="block text-sm font-semibold mb-1">Distancia del viaje (KM en Maps)</label>
                <input type="number" id="km" step="0.1" placeholder="Ej: 8.5" class="w-full p-2 rounded bg-gray-700 border-none focus:ring-2 focus:ring-yellow-500 text-white">
            </div>

            <div class="flex items-center bg-gray-700 p-3 rounded mt-2 border border-gray-600">
                <input type="checkbox" id="interurbano" class="w-5 h-5 text-yellow-500 rounded bg-gray-900 border-gray-600 focus:ring-yellow-500">
                <label for="interurbano" class="ml-3 text-sm font-bold text-yellow-400">
                    ⚠️ Viaje Interurbano (Guanipa ↔ El Tigre)
                </label>
            </div>

            <button onclick="calcular()" class="w-full bg-yellow-500 hover:bg-yellow-600 text-black font-bold py-3 rounded-lg transition mt-4 shadow-lg">
                CALCULAR TARIFA
            </button>
        </div>

        <hr class="my-6 border-gray-600">

        <div id="resultados" class="hidden space-y-3 bg-gray-900 p-5 rounded-lg border border-gray-700">
            <p class="text-xl text-center text-white font-bold mb-2">Tus Números (Privado):</p>
            <div class="flex justify-between border-b border-gray-700 pb-2">
                <span class="text-gray-400">Tarifa Total Cliente:</span>
                <span class="text-green-400 font-bold text-lg">$<span id="res_total">0.00</span></span>
            </div>
            <div class="flex justify-between border-b border-gray-700 pb-2">
                <span class="text-gray-400">Ahorro Moto (20%):</span>
                <span class="text-blue-400 font-bold">$<span id="res_moto">0.00</span></span>
            </div>
            <div class="flex justify-between border-b border-gray-700 pb-2">
                <span class="text-gray-400">Fondo Gasolina (15%):</span>
                <span class="text-red-400 font-bold">$<span id="res_gas">0.00</span></span>
            </div>
            <div class="flex justify-between pt-1">
                <span class="text-gray-200 font-bold">Tu Ganancia Neta:</span>
                <span class="text-yellow-400 font-bold text-lg">$<span id="res_neto">0.00</span></span>
            </div>
        </div>

        <button id="btnWhatsapp" class="hidden mt-6 w-full bg-[#25D366] hover:bg-[#1DA851] text-white py-3 rounded-lg font-bold flex justify-center items-center shadow-lg transition">
            <svg class="w-6 h-6 mr-2" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z"/></svg>
            ENVIAR COTIZACIÓN AL CLIENTE
        </button>
    </div>

    <script>
        function calcular() {
            // 1. Obtener los datos que llenaste en la App
            const tipoServicio = document.getElementById('tipoServicio').value;
            const kmInput = document.getElementById('km').value;
            const desc = document.getElementById('descripcion').value || "Servicio solicitado";
            const esInterurbano = document.getElementById('interurbano').checked;

            // Validación de seguridad
            if (!kmInput || kmInput <= 0) {
                alert("Mano, ingresa una distancia válida en KM para poder calcular.");
                return;
            }

            const km = parseFloat(kmInput);

            // 2. Motor de Precios (La lógica pesada)
            let tarifaBase = 0;
            let precioPorKm = 0;
            let bonoInterurbano = esInterurbano ? 1.50 : 0; // Aquí está tu protección de triangulación

            if (tipoServicio === 'delivery') {
                tarifaBase = 1.00;  // Base baja, se gana en el volumen
                precioPorKm = 0.60;
            } else if (tipoServicio === 'mototaxi') {
                tarifaBase = 1.50;  // Base media por desgaste de peso
                precioPorKm = 0.80; // KM más caro por el pasajero
            } else if (tipoServicio === 'mandado') {
                tarifaBase = 2.00;  // Base alta porque inviertes tiempo esperando
                precioPorKm = 0.70;
            }

            // 3. El Cálculo Matemático
            let costoViaje = tarifaBase + (km * precioPorKm) + bonoInterurbano;
            
            // Redondear para que no salgan números raros (ej. 3.42 pasa a 3.50)
            let total = Math.ceil(costoViaje * 10) / 10; 

            // 4. Tus Cuentas Internas (El control financiero)
            let ahorroMoto = total * 0.20;
            let gasolina = total * 0.15;
            let neto = total - ahorroMoto - gasolina;

            // 5. Imprimir en tu pantalla
            document.getElementById('resultados').classList.remove('hidden');
            document.getElementById('res_total').innerText = total.toFixed(2);
            document.getElementById('res_moto').innerText = ahorroMoto.toFixed(2);
            document.getElementById('res_gas').innerText = gasolina.toFixed(2);
            document.getElementById('res_neto').innerText = neto.toFixed(2);

            // 6. Preparar el Mensaje Automático para el Cliente
            let tipoTexto = tipoServicio.toUpperCase();
            let zonaTexto = esInterurbano ? "🛣️ (Guanipa ↔ El Tigre)" : "📍 (Zona Local)";
            
            const mensaje = `¡Hola! 🛵 Aquí tienes la cotización de tu servicio de *${tipoTexto}*:\n\n📦 Detalle: ${desc}\n${zonaTexto}\n\n💰 *Total a pagar: $${total.toFixed(2)}*\n\n¿Me confirmas para arrancar de una vez? 🚀`;
            
            const url = `https://wa.me/?text=${encodeURIComponent(mensaje)}`;
            
            // Mostrar y activar el botón de WhatsApp
            const btnW = document.getElementById('btnWhatsapp');
            btnW.classList.remove('hidden');
            btnW.onclick = () => window.open(url, '_blank');
        }
    </script>
</body>
</html>
