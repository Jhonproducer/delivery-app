<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Gerencial - Mi Delivery</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans p-4 pb-20">

    <div class="max-w-md mx-auto bg-gray-800 rounded-xl shadow-2xl border border-blue-500 overflow-hidden mt-2">
        <div class="bg-blue-900 p-4 text-center">
            <h1 class="text-2xl font-bold text-white">⚙️ Mi Panel de Control</h1>
            <p class="text-blue-300 text-sm">Guanipa - El Tigre</p>
        </div>
        
        <div class="p-6 space-y-4">
            <div>
                <label class="block text-sm font-semibold text-gray-300 mb-1">Tipo de Servicio</label>
                <select id="tipo" class="w-full p-3 rounded bg-gray-700 border-none focus:ring-2 focus:ring-blue-500 text-white">
                    <option value="Delivery">🍔 Delivery</option>
                    <option value="MotoTaxi">🧑‍🤝‍🧑 MotoTaxi</option>
                    <option value="Mandado">📦 Mandado / Encomienda</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-300 mb-1">Distancia del viaje (KM)</label>
                <input type="number" id="km" step="0.1" placeholder="Ej: 7.5" class="w-full p-3 rounded bg-gray-700 border-none focus:ring-2 focus:ring-blue-500 text-white">
            </div>

            <div class="flex items-center bg-gray-700 p-3 rounded border border-gray-600">
                <input type="checkbox" id="interurbano" class="w-5 h-5 text-blue-500 rounded bg-gray-900 border-gray-600 focus:ring-blue-500">
                <label for="interurbano" class="ml-3 text-sm font-bold text-blue-400">
                    ⚠️ Viaje Interurbano (Bono +$1.50)
                </label>
            </div>

            <button onclick="procesarViaje()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-lg transition mt-2">
                CALCULAR VIAJE
            </button>
        </div>

        <div id="panelResultados" class="hidden bg-gray-900 p-6 border-t border-gray-700">
            <h2 class="text-lg font-bold text-gray-200 mb-3 border-b border-gray-700 pb-2">Resumen Financiero:</h2>
            
            <div class="space-y-2 mb-4">
                <p class="flex justify-between text-gray-400">Total Cliente: <span class="text-white font-bold">$<span id="resTotal">0.00</span></span></p>
                <p class="flex justify-between text-gray-400">Fondo Moto (20%): <span class="text-blue-400 font-bold">$<span id="resMoto">0.00</span></span></p>
                <p class="flex justify-between text-gray-400">Tu Ganancia Neta: <span class="text-green-400 font-bold text-lg">$<span id="resNeto">0.00</span></span></p>
            </div>

            <div class="space-y-3">
                <button id="btnGuardar" onclick="enviarBaseDatos()" class="w-full bg-yellow-600 hover:bg-yellow-700 text-white font-bold py-3 rounded-lg shadow transition flex justify-center items-center">
                    💾 GUARDAR EN MI EXCEL
                </button>
                
                <button id="btnWhatsapp" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg shadow transition flex justify-center items-center">
                    📲 ENVIAR COTIZACIÓN WHATSAPP
                </button>
            </div>
            
            <p id="mensajeExito" class="hidden text-green-400 text-center text-sm font-bold mt-3">¡Viaje registrado en tu Excel exitosamente!</p>
        </div>
    </div>

    <script>
        // ==========================================
        // ⚠️ PEGA AQUÍ TU LINK DE GOOGLE APPS SCRIPT
        // ==========================================
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbze1g49-3zDogIwzhO0z8oWsr5_DKN5OKzen0pCWVO0f3dxxrLU1kQgP-07d-n8mRDI/exec"; 

        // Variables globales para guardar temporalmente
        let datosActuales = {};

        function procesarViaje() {
            const tipo = document.getElementById('tipo').value;
            const kmInput = document.getElementById('km').value;
            const esInterurbano = document.getElementById('interurbano').checked;

            if (!kmInput || kmInput <= 0) {
                alert("Mano, ingresa los kilómetros para calcular.");
                return;
            }

            const km = parseFloat(kmInput);
            
            // Lógica de Precios
            let tarifaBase = (tipo === 'Delivery') ? 1.00 : (tipo === 'MotoTaxi' ? 1.50 : 2.00);
            let precioPorKm = (tipo === 'Delivery') ? 0.60 : (tipo === 'MotoTaxi' ? 0.80 : 0.70);
            let bono = esInterurbano ? 1.50 : 0;

            let totalBruto = tarifaBase + (km * precioPorKm) + bono;
            let total = Math.ceil(totalBruto * 10) / 10; // Redondeo limpio
            
            let fondoMoto = total * 0.20;
            let gasolina = total * 0.15;
            let gananciaNeta = total - fondoMoto - gasolina;

            // Mostrar resultados en pantalla
            document.getElementById('resTotal').innerText = total.toFixed(2);
            document.getElementById('resMoto').innerText = fondoMoto.toFixed(2);
            document.getElementById('resNeto').innerText = gananciaNeta.toFixed(2);
            
            document.getElementById('panelResultados').classList.remove('hidden');
            document.getElementById('mensajeExito').classList.add('hidden');
            document.getElementById('btnGuardar').disabled = false;
            document.getElementById('btnGuardar').innerText = "💾 GUARDAR EN MI EXCEL";

            // Guardar en variable global para enviarlo a la Base de Datos
            datosActuales = {
                fecha: new Date().toLocaleDateString('es-VE'),
                tipo: tipo,
                ganancia: gananciaNeta.toFixed(2),
                moto: fondoMoto.toFixed(2),
                km: km
            };

            // Configurar botón WhatsApp
            const mensajeWa = `¡Hola! 🛵 Cotización de tu servicio de *${tipo}*:\n\n💰 *Total a pagar: $${total.toFixed(2)}*\n\n¿Me confirmas para arrancar de una vez?`;
            document.getElementById('btnWhatsapp').onclick = () => {
                window.open(`https://wa.me/?text=${encodeURIComponent(mensajeWa)}`, '_blank');
            };
        }

        async function enviarBaseDatos() {
            const btn = document.getElementById('btnGuardar');
            btn.innerText = "⏳ Guardando...";
            btn.disabled = true;

            try {
                // Enviar datos a Google Sheets sin recargar la página
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datosActuales)
                });
                
                // Éxito visual
                document.getElementById('mensajeExito').classList.remove('hidden');
                btn.innerText = "✅ GUARDADO";
                
                // Limpiar formulario para el siguiente viaje
                setTimeout(() => {
                    document.getElementById('km').value = '';
                    document.getElementById('interurbano').checked = false;
                }, 2000);

            } catch (error) {
                alert("Hubo un error al guardar. Revisa tu conexión.");
                btn.innerText = "💾 INTENTAR DE NUEVO";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
